<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Bookings — GymRat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="brand">
            <span class="brand-icon"></span>
            <span>GymRat</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item"><a th:href="@{/}">Overview</a></li>
            <li class="nav-item"><a th:href="@{/profile}">Profile</a></li>
            <li class="nav-item"><a th:href="@{/classes}">Classes</a></li>
            <li class="nav-item active"><a th:href="@{/bookings}">Bookings</a></li>
            <li class="nav-item"><a th:href="@{/memberships}">Memberships</a></li>
            <li class="nav-item"><a th:href="@{/ai/feedback}">Feedback AI</a></li>
        </ul>
    </div>
     <div class="user-profile">
            <strong>John Doe</strong>
            <small style="display:block; color:var(--text-muted);">Club Manager</small>
        </div>
</aside>

<main class="content-area">
    <div class="page-header">
        <div class="page-subtitle">Bookings</div>
        <h1 class="page-title">Your bookings</h1>
        <p>Manage upcoming classes and your waitlist.</p>
    </div>

    <div th:if="${flashMessage}" class="flash-banner flash-success" th:text="${flashMessage}"></div>

    <div class="form-card">
        <form th:action="@{/bookings}" th:object="${bookingForm}" method="post">
            <div class="form-group">
                <label class="form-label" for="memberId">Member</label>
                <select id="memberId" class="form-select" th:field="*{memberId}">
                    <option value="">Select member...</option>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.fullName}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}" th:errors="*{memberId}"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="classInstanceId">Class Session</label>
                <select id="classInstanceId" class="form-select" th:field="*{classInstanceId}">
                    <option value="">Select class...</option>
                    <option th:each="ci : ${classInstances}"
                            th:value="${ci.id}"
                            th:text="${ci.title + ' — ' + #temporals.format(ci.startsAt, 'dd.MM.yyyy HH:mm')}">
                    </option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('classInstanceId')}" th:errors="*{classInstanceId}"></div>
            </div>

            <button type="submit" class="btn btn-primary">+ Book Class</button>
        </form>
    </div>
    <br/>

    <table class="data-table">
        <thead>
        <tr>
            <th>Member</th>
            <th>Class</th>
            <th>Starts At</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="b : ${bookings}">
            <td th:text="${b.member.fullName}"></td>
            <td th:text="${b.classInstance.title}"></td>
            <td th:text="${#temporals.format(b.classInstance.startsAt, 'dd.MM.yyyy HH:mm')}"></td>
            <td>
                <span class="badge"
                      th:classappend="${b.status == 'CANCELLED'} ? ' badge-cancelled' : ' badge-booked'"
                      th:text="${b.status}"></span>
            </td>
            <td>
                <form th:action="@{/bookings/{id}/cancel(id=${b.id})}" method="post">
                    <button type="submit" class="btn btn-secondary" th:disabled="${b.status == 'CANCELLED'}">Cancel</button>
                </form>
                <form th:action="@{/bookings/{id}/delete(id=${b.id})}" method="post">
                    <button type="submit" class="btn btn-secondary">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
