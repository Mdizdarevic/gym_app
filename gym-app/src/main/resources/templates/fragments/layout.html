<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? ${title} + ' - GymRat' : 'GymRat'">GymRat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon"></div>
                <span>GymRat</span>
            </div>
           <ul class="nav-list">
                <li class="nav-item"><a th:href="@{/}">Overview</a></li>
                <li class="nav-item"><a th:href="@{/profile}">Profile</a></li>
                <li class="nav-item"><a th:href="@{/classes}">Classes</a></li>
                <li class="nav-item"><a th:href="@{/bookings}">Bookings</a></li>
                <li class="nav-item"><a th:href="@{/memberships}">Memberships</a></li>
                <li class="nav-item"><a th:href="@{/ai/feedback}">Feedback AI</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <strong>John Doe</strong>
            <small style="display:block; color:var(--text-muted);">Club Manager</small>
        </div>
    </aside>

    <main class="content-area">
        <div th:replace="${content}"></div>
    </main>
</body>
</html>
