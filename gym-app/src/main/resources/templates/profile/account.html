<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Member Profile — GymRat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<aside class="sidebar">
    <div>
        <div class="brand">
            <span class="brand-icon"></span>
            <span>GymRat</span>
        </div>
        <ul class="nav-list">
            <li class="nav-item"><a th:href="@{/}">Overview</a></li>
            <li class="nav-item active"><a th:href="@{/profile}">Profile</a></li>
            <li class="nav-item"><a th:href="@{/classes}">Classes</a></li>
            <li class="nav-item"><a th:href="@{/bookings}">Bookings</a></li>
            <li class="nav-item"><a th:href="@{/memberships}">Memberships</a></li>
            <li class="nav-item"><a th:href="@{/ai/feedback}">Feedback AI</a></li>
        </ul>
    </div>
     <div class="user-profile">
        <strong>John Doe</strong>
        <small style="display:block; color:var(--text-muted);">Club Manager</small>
    </div>
</aside>

<main class="content-area">
    <div class="page-header">
        <div class="page-subtitle">Profile</div>
        <h1 class="page-title">Member profile &amp; memberships</h1>
        <p>Select a member and manage their active or frozen memberships.</p>
    </div>

    <div th:if="${flashMessage}" class="flash-banner flash-success" th:text="${flashMessage}"></div>

    <div class="form-card">
        <form th:action="@{/profile}" method="get">
            <div class="form-group">
                <label class="form-label" for="memberSelect">Active Member</label>
                <select id="memberSelect" name="memberId" class="form-select" onchange="this.form.submit()">
                    <option th:each="m : ${members}"
                            th:value="${m.id}"
                            th:selected="${selectedMember != null and m.id == selectedMember.id}"
                            th:text="${m.fullName + ' (' + m.email + ')'}">
                    </option>
                </select>
            </div>
        </form>
    </div>
    <br/>

    <div th:if="${selectedMember != null}" class="form-card">
        <h2 th:text="${selectedMember.fullName}"></h2>
        <p th:text="${selectedMember.email}"></p>

        <form th:action="@{/profile/memberships}" method="post">
            <input type="hidden" name="memberId" th:value="${selectedMember.id}">

            <div class="form-group">
                <label class="form-label" for="planId">Membership Plan</label>
                <select id="planId" name="planId" class="form-select" required>
                    <option value="">Select plan...</option>
                    <option th:each="p : ${plans}"
                            th:value="${p.id}"
                            th:text="${p.name + ' (' + p.billingInterval + ')'}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="startDate">Start Date</label>
                <input id="startDate" type="date" name="startDate" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label" for="endDate">End Date</label>
                <input id="endDate" type="date" name="endDate" class="form-input">
            </div>

            <button type="submit" class="btn btn-primary">+ Assign Membership</button>
        </form>
    </div>
    <br/>

    <table th:if="${selectedMember != null and !#lists.isEmpty(memberships)}" class="data-table">
        <thead>
        <tr>
            <th>Plan</th>
            <th>Start</th>
            <th>End</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ms : ${memberships}">
            <td th:text="${ms.plan.name}"></td>
            <td th:text="${ms.startDate}"></td>
            <td th:text="${ms.endDate != null ? ms.endDate : '—'}"></td>
            <td>
                <span class="badge"
                      th:classappend="${ms.status == 'ACTIVE'} ? ' badge-active' : ' badge-frozen'"
                      th:text="${ms.status}"></span>
            </td>
            <td>
                <form th:action="@{/profile/memberships/{id}/toggle-freeze(id=${ms.id})}" method="post">
                    <input type="hidden" name="memberId" th:value="${selectedMember.id}">
                    <button type="submit" class="btn btn-secondary"
                            th:text="${ms.status == 'FROZEN'} ? 'Unfreeze' : 'Freeze'"></button>
                </form>
                <form th:action="@{/profile/memberships/{id}/delete(id=${ms.id})}" method="post">
                    <input type="hidden" name="memberId" th:value="${selectedMember.id}">
                    <button type="submit" class="btn btn-secondary">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
