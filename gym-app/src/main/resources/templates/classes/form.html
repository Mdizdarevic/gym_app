<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Class - GymRat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div>
            <div class="brand">
                <div class="brand-icon"></div>
                <span>GymRat</span>
            </div>
            <ul class="nav-list">
                <li class="nav-item"><a th:href="@{/}">Overview</a></li>
                <li class="nav-item"><a th:href="@{/profile}">Profile</a></li>
                <li class="nav-item active"><a th:href="@{/classes}">Classes</a></li>
                <li class="nav-item"><a th:href="@{/bookings}">Bookings</a></li>
                <li class="nav-item"><a th:href="@{/memberships}">Memberships</a></li>
                <li class="nav-item"><a th:href="@{/ai/feedback}">Feedback AI</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <strong>John Doe</strong>
            <small style="display:block; color:var(--text-muted);">Club Manager</small>
        </div>
    </aside>

    <!-- Main Form Content -->
    <main class="content-area">
        <div class="page-header">
            <span class="page-subtitle">CLASS INSTANCE</span>
            <h1 class="page-title">Schedule a class</h1>
            <p style="color:var(--text-muted);">Add a session from an existing class template.</p>
        </div>

        <!-- Global Validation Error Banner -->
        <div th:if="${#fields.hasErrors('${classInstance.*}')}" class="flash-banner flash-error">
            <span>&#10060; Please correct the fields below before saving this class.</span>
        </div>

        <div class="form-card">
            <form th:action="@{/classes/save}" th:object="${classInstance}" method="post">
                <div class="form-group">
                    <label class="form-label">Class template *</label>
                    <select class="form-select" th:field="*{classTemplateId}">
                        <option value="">Select a template...</option>
                        <option th:each="tpl : ${templates}" th:value="${tpl.id}" th:text="${tpl.name}"></option>
                    </select>
                </div>

                <div style="display: flex; gap: 16px;">
                    <div class="form-group" style="flex:1;">
                        <label class="form-label">Date *</label>
                        <input type="date" class="form-input" th:field="*{date}" 
                               th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label class="form-label">Start time *</label>
                        <input type="time" class="form-input" th:field="*{startTime}">
                    </div>
                </div>

                <div style="display: flex; gap: 16px;">
                    <div class="form-group" style="flex:1;">
                        <label class="form-label">Instructor *</label>
                        <input type="text" class="form-input" th:field="*{instructor}">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label class="form-label">Capacity *</label>
                        <input type="number" class="form-input" th:field="*{capacity}"
                               th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Studio notes</label>
                    <textarea class="form-textarea" rows="3" th:field="*{notes}" placeholder="Equipment, room setup or instructor notes"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <a th:href="@{/classes}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Schedule class</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
